[project]
name = "simple-reward-hacking"
description = "Code-execution environment designed to elicit reward hacking, with AST-based hack-detection metrics."
tags = ["multiturn", "reward-hacking", "dont-train-on-this", "code", "train", "eval"]
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "verifiers>=0.1.9,<0.1.10",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.10.6",
]
training-tinker = [
    "tinker-cookbook[verifiers,wandb]>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

